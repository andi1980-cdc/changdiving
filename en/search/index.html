          "target": {

  <body>
    <!-- Navigation -->
    <nav id="breadcrumb" class="breadcrumb"></nav>
    
    <div class="container">
      <header>
        <h1>Search Chang Diving Center</h1>
        <p>Find diving courses, dive sites, and scuba diving information</p>
      </header>
      
      <!-- Search Form -->
      <div class="search-container">
        <form id="searchForm" class="search-form">
          <input 
            type="text" 
            id="searchInput" 
            name="q" 
            placeholder="Search for courses, dive sites, or topics..."
            value=""
            required
          />
          <button type="submit">Search</button>
        </form>
      </div>
      
      <!-- Search Results -->
      <div id="searchResults" class="search-results">
        <div class="search-info">
          <p>Enter a search term above to find relevant content.</p>
        </div>
      </div>
    </div>
    
    <!-- Scripts -->
    <script src="/js/global.js"></script>
    <script>
      // Comprehensive search data
      const searchData = [
        // Courses

        },
        {

        },

        },
        {

        },
        {

        },
        {

        },
        
        // Day Trips
        {
          title: 'Fun Dives',
          url: '/en/day-trips/fun-dives/',
          description: 'Daily fun dives to the best dive sites around Koh Chang.',
          category: 'Day Trip',
          keywords: ['fun dives', 'daily', 'dive sites', 'recreational']
        },
        {
          title: 'Try Dive',
          url: '/en/day-trips/try-dive/',
          description: 'Experience scuba diving for the first time with our try dive program.',
          category: 'Day Trip',
          keywords: ['try dive', 'first time', 'experience', 'discovery']
        },
        {
          title: 'Snorkeling Trips',
          url: '/en/day-trips/snorkeling/',
          description: 'Explore the underwater world with our snorkeling trips.',
          category: 'Day Trip',
          keywords: ['snorkeling', 'surface', 'exploration', 'marine life']
        },
        
        // Equipment
        {
          title: 'Scuba Equipment',
          url: '/en/equipment/',
          description: 'Quality scuba diving equipment for sale and rental.',
          category: 'Equipment',
          keywords: ['equipment', 'gear', 'rental', 'sale', 'scuba']
        },
        {
          title: 'Used Scuba Gear',
          url: '/en/equipment/used-scuba-gear/',
          description: 'Affordable used scuba diving equipment in good condition.',
          category: 'Equipment',
          keywords: ['used', 'second hand', 'affordable', 'gear', 'equipment']
        }
      ];

      // Search functionality
      document.getElementById('searchForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const query = document.getElementById('searchInput').value.trim();
        if (query) {
          performSearch(query);
        }
      });
      
      // Check for search query in URL
      const urlParams = new URLSearchParams(window.location.search);
      const searchQuery = urlParams.get('q');
      if (searchQuery) {
        document.getElementById('searchInput').value = searchQuery;
        performSearch(searchQuery);
      }
      
      function performSearch(query) {
        const resultsContainer = document.getElementById('searchResults');
        resultsContainer.innerHTML = '<div class="loading">Searching...</div>';
        
        // Simulate search delay
        setTimeout(() => {
          displaySearchResults(query);
        }, 300);
      }
      
      function displaySearchResults(query) {
        const resultsContainer = document.getElementById('searchResults');
        const searchTerms = query.toLowerCase().split(' ').filter(term => term.length > 0);
        
        // Search through all data
        const filteredResults = searchData.filter(item => {
          const searchableText = `${item.title} ${item.description} ${item.keywords.join(' ')} ${item.category}`.toLowerCase();
          return searchTerms.some(term => searchableText.includes(term));
        });
        
        // Sort by relevance (exact matches first)
        filteredResults.sort((a, b) => {
          const aScore = getRelevanceScore(a, searchTerms);
          const bScore = getRelevanceScore(b, searchTerms);
          return bScore - aScore;
        });
        
        if (filteredResults.length > 0) {
          resultsContainer.innerHTML = `
            <div class="search-info">
              <h2>Search Results for "${query}"</h2>
              <p>Found ${filteredResults.length} result(s)</p>
            </div>
            <div class="results-list">
              ${filteredResults.map(result => `
                <div class="result-item">
                  <div class="result-category">${result.category}</div>
                  <h3><a href="${result.url}">${result.title}</a></h3>
                  <p>${result.description}</p>
                </div>
              `).join('')}
            </div>
          `;
        } else {
          resultsContainer.innerHTML = `
            <div class="search-info">
              <h2>No results found for "${query}"</h2>
              <p>Try searching for different terms like:</p>
              <ul style="text-align: left; max-width: 400px; margin: 1rem auto;">
                <li>"diving" or "scuba"</li>
                <li>"courses" or "open water"</li>
                <li>"dive sites" or "wreck"</li>
                <li>"equipment" or "gear"</li>
                <li>"fun dives" or "day trips"</li>
              </ul>
            </div>
          `;
        }
      }
      
      function getRelevanceScore(item, searchTerms) {
        let score = 0;
        const title = item.title.toLowerCase();
        const description = item.description.toLowerCase();
        const keywords = item.keywords.join(' ').toLowerCase();
        
        searchTerms.forEach(term => {
          if (title.includes(term)) score += 10;
          if (keywords.includes(term)) score += 5;
          if (description.includes(term)) score += 2;
        });
        
        return score;
      }
    </script>
  </body>
