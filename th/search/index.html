    <style>

  <body>
    <!-- Navigation -->
    <nav id="breadcrumb" class="breadcrumb"></nav>
    
    <div class="container">
      <header>
        <h1>ค้นหาช้างไดฟ์วิ่ง</h1>
        <p>ค้นหาคอร์สดำน้ำ จุดดำน้ำ และข้อมูลการดำน้ำ</p>
      </header>
      
      <!-- Search Form -->
      <div class="search-container">
        <form id="searchForm" class="search-form">
          <input 
            type="text" 
            id="searchInput" 
            name="q" 
            placeholder="ค้นหาคอร์ส จุดดำน้ำ หรือหัวข้อ..."
            value=""
            required
          />
          <button type="submit">ค้นหา</button>
        </form>
      </div>
      
      <!-- Search Results -->
      <div id="searchResults" class="search-results">
        <div class="search-info">
          <p>ใส่คำค้นหาด้านบนเพื่อหาข้อมูลที่เกี่ยวข้อง</p>
        </div>
      </div>
    </div>
    
    <!-- Scripts -->
    <script src="/js/global.js"></script>
    <script>
      // Dynamic search data generation from sitemap
      let searchData = [];
      
      // Function to fetch and parse sitemap
      async function loadSearchDataFromSitemap() {
        try {
          const response = await fetch('/sitemap.xml');
          const xmlText = await response.text();
          const parser = new DOMParser();
          const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
          
          const urls = xmlDoc.querySelectorAll('url');
          const currentLang = window.location.pathname.includes('/de/') ? 'de' : 
                             window.location.pathname.includes('/th/') ? 'th' : 'en';
          
          urls.forEach(url => {
            const loc = url.querySelector('loc').textContent;
            const lastmod = url.querySelector('lastmod')?.textContent || '';
            const priority = url.querySelector('priority')?.textContent || '0.5';
            
            // Only include pages for current language
            if (loc.includes(`/${currentLang}/`) || (currentLang === 'en' && !loc.includes('/de/') && !loc.includes('/th/'))) {
              const urlPath = loc.replace('https://changdiving.com', '');
              
              // Skip search page itself and main index
              if (urlPath.includes('/search/') || urlPath === '/' || urlPath === `/${currentLang}/`) {
                return;
              }
              
              // Generate title and description from URL
              const pathParts = urlPath.split('/').filter(part => part);
              let title = '';
              let description = '';
              let category = '';
              let keywords = [];
              
              // Extract meaningful title from URL
              if (pathParts.length > 0) {
                const lastPart = pathParts[pathParts.length - 1];
                title = lastPart
                  .split('-')
                  .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                  .join(' ');
                
                // Add category based on path
                if (urlPath.includes('/courses/')) {
                  category = 'คอร์ส';
                  keywords = ['คอร์ส', 'ดำน้ำ', 'scuba', 'การฝึก', 'ใบรับรอง'];
                } else if (urlPath.includes('/dive-sites/')) {
                  category = 'จุดดำน้ำ';
                  keywords = ['จุดดำน้ำ', 'ดำน้ำ', 'ใต้ทะเล', 'สัตว์ทะเล', 'ปะการัง'];
                } else if (urlPath.includes('/day-trips/')) {
                  category = 'ทริปวันเดียว';
                  keywords = ['ทริปวันเดียว', 'fun dive', 'ดำน้ำตื้น', 'ผจญภัย'];
                } else if (urlPath.includes('/posts/')) {
                  category = 'บทความ';
                  keywords = ['บทความ', 'blog', 'ข้อมูล', 'คู่มือ', 'ความรู้'];
                } else if (urlPath.includes('/faqs/')) {
                  category = 'คำถามที่พบบ่อย';
                  keywords = ['faq', 'คำถาม', 'คำตอบ', 'ช่วยเหลือ'];
                } else if (urlPath.includes('/equipment/')) {
                  category = 'อุปกรณ์';
                  keywords = ['อุปกรณ์', 'gear', 'อุปกรณ์ดำน้ำ', 'อุปกรณ์ scuba'];
                } else {
                  category = 'หน้าเว็บ';
                  keywords = ['ข้อมูล', 'หน้าเว็บ'];
                }
                
                // Add specific keywords based on URL content
                if (urlPath.includes('wreck')) {
                  keywords.push('เรือจม', 'shipwreck');
                }
                if (urlPath.includes('nitrox')) {
                  keywords.push('nitrox', 'อากาศเสริม');
                }
                if (urlPath.includes('advanced')) {
                  keywords.push('ขั้นสูง', 'มีประสบการณ์');
                }
                if (urlPath.includes('beginner')) {
                  keywords.push('ผู้เริ่มต้น', 'เริ่มต้น');
                }
                if (urlPath.includes('marine')) {
                  keywords.push('สัตว์ทะเล', 'ปลา', 'ปะการัง');
                }
                if (urlPath.includes('safety')) {
                  keywords.push('ความปลอดภัย', 'ปลอดภัย');
                }
                
                description = `${title} - ${category} บนเว็บไซต์ Chang Diving Center`;
              }
              
              if (title) {
                searchData.push({
                  title: title,
                  url: urlPath,
                  description: description,
                  category: category,
                  keywords: keywords,
                  priority: parseFloat(priority)
                });
              }
            }
          });
          
          // Sort by priority
          searchData.sort((a, b) => b.priority - a.priority);
          
          console.log(`Loaded ${searchData.length} searchable items for ${currentLang}`);
          
        } catch (error) {
          console.error('Error loading sitemap:', error);
          // Fallback to basic search data
          searchData = [
            {
              title: 'Open Water Diver Course',
              url: '/th/courses/open-water-diver/',
              description: 'เรียนรู้การดำน้ำ scuba กับคอร์ส PADI Open Water Diver ของเรา',
              category: 'คอร์ส',
              keywords: ['open water', 'ผู้เริ่มต้น', 'คอร์ส', 'padi', 'ดำน้ำ scuba']
            }
          ];
        }
      }
      
      // Load search data when page loads
      document.addEventListener('DOMContentLoaded', function() {
        loadSearchDataFromSitemap().then(() => {
          // Check if there's a search query in URL
          const urlParams = new URLSearchParams(window.location.search);
          const query = urlParams.get('q');
          if (query) {
            document.getElementById('searchInput').value = query;
            performSearch(query);
          } else {
            // Ensure search field is empty if no query
            document.getElementById('searchInput').value = '';
            document.getElementById('searchResults').innerHTML = '<div class="search-info"><p>ใส่คำค้นหาเพื่อหาข้อมูลที่เกี่ยวข้อง</p></div>';
          }
        });
      });

      function performSearch(query) {
        if (!query.trim()) {
          document.getElementById('searchResults').innerHTML = '<div class="search-info">กรุณาใส่คำค้นหา</div>';
          return;
        }
        
        const searchTerms = query.toLowerCase().split(' ').filter(term => term.length > 0);
        const results = searchData.filter(item => {
          const searchableText = `${item.title} ${item.description} ${item.keywords.join(' ')} ${item.category}`.toLowerCase();
          return searchTerms.some(term => searchableText.includes(term));
        });
        
        // Sort by relevance
        results.sort((a, b) => {
          const scoreA = getRelevanceScore(a, searchTerms);
          const scoreB = getRelevanceScore(b, searchTerms);
          return scoreB - scoreA;
        });
        
        displaySearchResults(results, query);
      }
      
      function getRelevanceScore(item, searchTerms) {
        let score = 0;
        const title = item.title.toLowerCase();
        const description = item.description.toLowerCase();
        const keywords = item.keywords.join(' ').toLowerCase();
        
        searchTerms.forEach(term => {
          // Title matches get highest score
          if (title.includes(term)) score += 10;
          // Keyword matches get high score
          if (keywords.includes(term)) score += 8;
          // Description matches get medium score
          if (description.includes(term)) score += 5;
          // Partial matches
          if (title.includes(term.substring(0, 3))) score += 3;
        });
        
        return score;
      }
      
      function displaySearchResults(results, query) {
        const resultsContainer = document.getElementById('searchResults');
        
        if (results.length === 0) {
          resultsContainer.innerHTML = `
            <div class="search-info">
              <h3>ไม่พบผลลัพธ์สำหรับ "${query}"</h3>
              <p>ลองใช้คำค้นหาอื่นหรือดูหมวดหมู่ของเรา:</p>
              <ul>
                <li>"คอร์สดำน้ำ" หรือ "open water"</li>
                <li>"จุดดำน้ำ" หรือ "เรือจม"</li>
                <li>"ทริปวันเดียว" หรือ "fun dive"</li>
                <li>"อุปกรณ์" หรือ "equipment"</li>
              </ul>
            </div>
          `;
          return;
        }
        
        let html = `<div class="search-info"><h3>${results.length} ผลลัพธ์สำหรับ "${query}"</h3></div>`;
        
        results.forEach(item => {
          html += `
            <div class="result-item">
              <div class="result-category">${item.category}</div>
              <h3><a href="${item.url}">${item.title}</a></h3>
              <p>${item.description}</p>
            </div>
          `;
        });
        
        resultsContainer.innerHTML = html;
      }
      
      // Handle form submission
      document.getElementById('searchForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const query = document.getElementById('searchInput').value;
        performSearch(query);
        
        // Update URL
        const url = new URL(window.location);
        url.searchParams.set('q', query);
        window.history.pushState({}, '', url);
      });
    </script>
